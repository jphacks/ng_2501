services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_agent_prod_app
    # command: bash -c "bash /workspaces/ai_agent/.devcontainer/setup.sh && cd back && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # ↑ setup.sh はビルド時に実行するのが望ましいですが、元のまま残します
    command: bash -c "cd back && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000" # setup.shはDockerfileの最後で実行推奨
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/devdb
      - PYTHONPATH=/workspaces/ai_agent
    depends_on:
      - db
    restart: unless-stopped
    # ports: は削除します (Nginx経由でのみアクセスさせるため)

  frontend:
    build:
      context: .
      dockerfile: front/Dockerfile
    container_name: ai_agent_prod_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://ani-math.jp/api
    # ports: は削除します (Nginx経由でのみアクセスさせるため)

  db:
    image: postgres:16-alpine
    container_name: ai_agent_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devdb
    volumes:
      - db_data_prod:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    container_name: ai_agent_prod_nginx
    ports:
      - "80:80"   # HTTP (80番) でアクセスできるように公開
      - "443:443" # HTTPS (443番)
    volumes:
      # Nginxの設定ファイルをマウントする
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      # SSL証明書とcertbot用のディレクトリ
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
      - frontend
    restart: unless-stopped
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: ai_agent_prod_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # 証明書取得時はこのサービスを使用（entrypointなし）
    # 起動しないようにprofilesで分離
    profiles:
      - tools

  certbot-renew:
    image: certbot/certbot
    container_name: ai_agent_prod_certbot_renew
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  db_data_prod: